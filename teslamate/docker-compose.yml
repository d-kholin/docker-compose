services:
  teslamateapi:
    image: tobiasehlert/teslamateapi:1.25.0
    restart: always
    depends_on:
      - database
    environment:
      - ENCRYPTION_KEY=${TESLAMATE_API_KEY}
      - DATABASE_USER=${TESLAMATE_DB_USER}
      - DATABASE_PASS=${TESLAMATE_DB_PASS}
      - DATABASE_NAME=${TESLAMATE_DB_NAME}
      - DATABASE_HOST=database
      - MQTT_HOST=mosquitto
      - TZ=America/Edmonton
    ports:
      - 8987:8080
    env_file:
      - ../stack.env

      
  teslamate:
    image: teslamate/teslamate:4.0.1
    restart: always
    environment:
      - ENCRYPTION_KEY=${TESLAMATE_ENCRYPTION_KEY}
      - DATABASE_USER=${TESLAMATE_DB_USER}
      - DATABASE_PASS=${TESLAMATE_DB_PASS}
      - DATABASE_NAME=${TESLAMATE_DB_NAME}
      - DATABASE_HOST=database
      - MQTT_HOST=mosquitto
    ports:
      - 4000:4000
    volumes:
      - ./import:/opt/app/import
    cap_drop:
      - all

  database:
    image: postgres:18-trixie
    restart: always
    environment:
      - POSTGRES_USER=${TESLAMATE_DB_USER}
      - POSTGRES_PASSWORD=${TESLAMATE_DB_PASS}
      - POSTGRES_DB=${TESLAMATE_DB_NAME}
    volumes:
      - teslamate-db:/var/lib/postgresql

  grafana:
    image: teslamate/grafana:4.0.1
    restart: always
    environment:
      - DATABASE_USER=${TESLAMATE_DB_USER}
      - DATABASE_PASS=${TESLAMATE_DB_PASS}
      - DATABASE_NAME=${TESLAMATE_DB_NAME}
      - DATABASE_HOST=database
    ports:
      - 3033:3000
    volumes:
      - teslamate-grafana-data:/var/lib/grafana

  mosquitto:
    image: eclipse-mosquitto:2
    restart: always
    command: mosquitto -c /mosquitto-no-auth.conf
    # ports:
    #   - 1883:1883
    volumes:
      - mosquitto-conf:/mosquitto/config
      - mosquitto-data:/mosquitto/data

volumes:
  teslamate-db:
  teslamate-grafana-data:
  mosquitto-conf:
  mosquitto-data:
