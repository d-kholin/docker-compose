services:
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2.11.0
    container_name: pocket-id
    restart: unless-stopped
    env_file:
      - ../stack.env
    ports:
      - 1411:1411
    volumes:
      - pocket-id_data:/app/data
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 1m30s
      timeout: 5s
      retries: 2
      start_period: 10s

volumes:
  pocket-id_data: {}
