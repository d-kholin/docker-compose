services:
  audiobookshelf:
    restart: unless-stopped
    image: ghcr.io/advplyr/audiobookshelf:2.36.0
    ports:
      - '8097:80'
    volumes:
      - audiobooks:/audiobooks
      - podcasts:/podcasts
      - config:/config
      - metadata:/metadata

volumes:
  audiobooks: {}
  podcasts: {}
  config: {}
  metadata: {}
